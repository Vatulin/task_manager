<!-- tasks/task_item.html -->
<div class="task-item-card d-flex align-items-center justify-content-between p-3 mb-2 bg-white border border-start-0 text-start {% if task.priority == 'HIGH' %}priority-high{% elif task.priority == 'MEDIUM' %}priority-medium{% else %}priority-low{% endif %}">
    
    <!-- Левый блок: Основной контент задачи (занимает всё доступное место) -->
    <div class="flex-grow-1 min-w-0 pe-3">
        <!-- Заголовок и период -->
        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
            <span class="task-period-badge text-uppercase font-monospace text-secondary bg-light border px-2 py-0.5">
                {{ task.get_period_display }}
            </span>
            <a href="{% url 'tasks:task_detail' task.id %}" class="task-title-link text-dark fw-semibold text-decoration-none text-truncate d-inline-block max-w-100">
                {{ task.title }}
            </a>
        </div>
        
        <!-- Метаданные: Ответственный и Дедлайн -->
        <p class="m-0 small text-muted">
            Ответственный: 
            {% if task.assignee %}
                <a href="{% url 'users:profile' task.assignee.id %}" class="task-assignee-link text-secondary text-decoration-none fw-medium">
                    {{ task.assignee.username }}
                </a>
            {% else %}
                <span class="text-danger">Не назначен</span>
            {% endif %}
            <span class="mx-2 text-black-50">|</span>
            Срок: <span class="fw-medium text-dark">{{ task.deadline|date:"d.m.Y H:i" }}</span>
        </p>
    </div>

    <!-- Правый блок: Статус (защищен от переносов и сжатия) -->
    <div class="flex-shrink-0 text-nowrap">
        <span class="task-status-indicator small fw-bold text-uppercase border-bottom border-2 px-1 {% if task.status == 'completed' %}border-success text-success{% else %}border-primary text-primary{% endif %}">
            {{ task.get_status_display }}
        </span>
    </div>

</div>
