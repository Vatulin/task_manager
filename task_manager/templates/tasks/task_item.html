<div class="flex items-center gap-4 border-l-4 {% if task.priority == 'HIGH' %}border-red-500{% elif task.priority == 'MEDIUM' %}border-yellow-500{% else %}border-green-500{% endif %} bg-gray-50 p-4 rounded-r-lg shadow-xs hover:bg-gray-100 transition-all duration-200">
    
    <!-- flex-1 + min-w-0 + text-left гарантируют, что блок займёт доступное место, но не уедет вправо -->
    <a href="{% url 'tasks:task_detail' task.id %}" class="flex-1 min-w-0 text-left">
        <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-bold uppercase tracking-wide px-2 py-0.5 rounded bg-gray-200 text-gray-700">
                {{ task.get_period_display }}
            </span>
            <span class="font-medium text-gray-900 hover:text-indigo-600 transition-colors truncate">
                {{ task.title }}
            </span>
        </div>
        <p class="text-sm text-gray-500 mt-1">
            Ответственный: 
            {% if task.assignee %}
                <a href="{% url 'users:profile' task.assignee.id %}" class="text-gray-500 hover:text-indigo-600 transition-colors">
                    {{ task.assignee.username }}
                </a>
            {% else %}
                Не назначен
            {% endif %}
            <span class="mx-1">|</span>
            Дедлайн: {{ task.deadline|date:"d.m.Y H:i" }}
        </p>
    </a>

    <!-- flex-shrink-0 + whitespace-nowrap защищают статус от сжатия или переноса -->
    <div class="flex-shrink-0">
        <span class="rounded-full px-3 py-1 text-xs font-semibold bg-blue-100 text-blue-800 whitespace-nowrap">
            {{ task.get_status_display }}
        </span>
    </div>
</div>
