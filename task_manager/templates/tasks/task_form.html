{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto my-8 p-6 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-800">🛠️ Создание новой задачи</h2>
        <a href="{% url 'users:dashboard' %}" class="group flex items-center text-sm text-gray-500 hover:text-gray-700 transition">
            <svg class="w-4 h-4 mr-1 transform transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Назад
        </a>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700">
                    {{ field.label }}
                    {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
                </label>
                {{ field }}
                {% if field.help_text %}
                    <p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>
                {% endif %}
                {% if field.errors %}
                    <div class="text-xs text-red-500 mt-1">
                        {{ field.errors|striptags }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="pt-4 flex justify-end space-x-3">
            <a href="{% url 'users:dashboard' %}" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition text-sm">
                Отмена
            </a>
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                Сохранить задачу
            </button>
        </div>
    </form>
</div>
{% endblock %}
