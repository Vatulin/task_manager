{% extends "base.html" %}

{% block content %}
<div class="container-fluid max-width-container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <!-- Основная карточка формы -->
            <div class="card bg-white border border-light-subtle dashboard-card p-4 my-4 text-start">
                
                <!-- Шапка формы -->
                <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                    <h2 class="h4 text-dark m-0 fw-bold">Создание новой задачи</h2>
                    <a href="{% url 'users:dashboard' %}" class="btn btn-link btn-sm text-secondary text-decoration-none p-0 task-back-btn">
                        &larr; Назад
                    </a>
                </div>

                <!-- Строгая форма -->
                <form method="post" class="app-strict-form">
                    {% csrf_token %}
                    
                    <div class="d-flex flex-column gap-3">
                        {% for field in form %}
                            <div class="form-field-group">
                                <label class="form-label small fw-semibold text-secondary mb-1">
                                    {{ field.label }}
                                    {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
                                </label>
                                
                                <!-- Обертка для стилизации дефолтных полей Django через CSS -->
                                <div class="django-input-wrapper">
                                    {{ field }}
                                </div>
                                
                                {% if field.help_text %}
                                    <div class="form-text text-muted font-monospace mt-1 task-form-help">
                                        {{ field.help_text }}
                                    </div>
                                {% endif %}
                                
                                {% if field.errors %}
                                    <div class="text-danger small fw-medium mt-1 task-form-error">
                                        {{ field.errors|striptags }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}
                    </div>

                    <!-- Кнопки управления -->
                    <div class="pt-4 d-flex justify-content-end gap-2 border-top mt-4">
                        <a href="{% url 'users:dashboard' %}" class="btn btn-sm btn-light border text-secondary px-3 rounded-1">
                            Отмена
                        </a>
                        <button type="submit" class="btn btn-sm btn-primary px-3 rounded-1">
                            Сохранить задачу
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
{% endblock %}
