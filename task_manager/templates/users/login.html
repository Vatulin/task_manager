{% extends "base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 400px;">
  <h3 class="mb-4 text-center">Вход в систему</h3>
  <div class="card p-4 shadow-sm">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
